<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MY-SHOP app">
  <defs>
    <linearGradient id="tile" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a7d84"/>
      <stop offset="55%" stop-color="#0f9f8c"/>
      <stop offset="100%" stop-color="#0b6f78"/>
    </linearGradient>
    <linearGradient id="gold" x1="40" y1="56" x2="88" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7c26a"/>
      <stop offset="100%" stop-color="#f2b045"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="28%" cy="26%" r="42%">
      <stop offset="0%" stop-color="#f2b045" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#f2b045" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="78%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#3ecfbf" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#3ecfbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="30%" cy="78%" r="38%">
      <stop offset="0%" stop-color="#ff785a" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ff785a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#061216"/>
  <circle class="orb orb-gold" cx="34" cy="34" r="36" fill="url(#glowGold)"/>
  <circle class="orb orb-teal" cx="96" cy="38" r="34" fill="url(#glowTeal)"/>
  <circle class="orb orb-coral" cx="40" cy="98" r="32" fill="url(#glowCoral)"/>

  <rect class="tile" x="18" y="18" width="92" height="92" rx="26" fill="url(#tile)"/>
  <rect x="22" y="22" width="84" height="84" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>

  <g class="glyph" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 42c0-10 10-16 16-16s16 6 16 16" stroke="#f6fafa" stroke-width="7"/>
    <rect x="38" y="46" width="52" height="42" rx="12" fill="#f6fafa" stroke="none"/>
    <rect class="bar" x="48" y="60" width="32" height="8" rx="4" fill="url(#gold)" stroke="none"/>
    <circle class="dot" cx="78" cy="78" r="5" fill="#3ecfbf" stroke="none"/>
  </g>

  <style>
    .orb-gold { animation: driftA 4.8s ease-in-out infinite; transform-origin: 34px 34px; }
    .orb-teal { animation: driftB 5.4s ease-in-out infinite; transform-origin: 96px 38px; }
    .orb-coral { animation: driftC 6s ease-in-out infinite; transform-origin: 40px 98px; }
    .tile { animation: breathe 3.6s ease-in-out infinite; transform-origin: 64px 64px; }
    .glyph { animation: floatY 3.2s ease-in-out infinite; transform-origin: 64px 64px; }
    .bar { animation: shimmer 2.4s ease-in-out infinite; transform-origin: 64px 64px; }
    .dot { animation: pulse 1.8s ease-in-out infinite; transform-origin: 78px 78px; }
    @keyframes driftA {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: .95; }
      50% { transform: translate(6px, 4px) scale(1.08); opacity: 1; }
    }
    @keyframes driftB {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-5px, 6px) scale(1.1); }
    }
    @keyframes driftC {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5px, -4px) scale(1.06); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes shimmer {
      0%, 100% { transform: scaleX(1); opacity: 1; }
      50% { transform: scaleX(1.08); opacity: .92; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: .85; }
    }
  </style>
</svg>
