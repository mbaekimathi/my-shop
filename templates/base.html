{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MY-SHOP — employee registration, login, and role-based access.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#10282c">
  <link rel="manifest" href="{% url 'core:web_manifest' %}">
  <title>{% block title %}MY-SHOP{% endblock %}</title>
  <script>
    (function () {
      try {
        var key = "myshop-theme";
        var stored = localStorage.getItem(key);
        var theme = stored;
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </noscript>
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=offline-toast2&r=theme1&shop-scroll=9&serial-scan=3&stock-print=5&stock-responsive=2&item-sort=1&stock-matrix=8&stock-view=4&serials-ui=4&hr-ui=5&pos-ui=1&receipt-ui=2&profile-ui=1&buy-stock-ui=6&expense-modal=1&receipts-ui=1&stock-req-ui=4&day-ui=2&ax-shop-graph=1&ax-credits-graph=1&comms-wa=20&stock-shop-filter=2&serial-in-check=1&header-mobile=1&ax-ledger=7&ax-list-table=2&ax-sales=1&ax-movements=1&ax-balances=2&ax-sales=2&ax-items=1&ax-stock=1&ax-credits=1&ax-suppliers=3&ax-columns=3&ax-client-account=2&credit-note=5&print-bold=1">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-sync-url="{% url 'employees:sync' %}" data-sync-register-url="{% url 'employees:sync_register' %}">
  {% include "partials/offline_bar.html" %}
  {% block body %}{% endblock %}
  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
