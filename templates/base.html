{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ company_name|default:'MY-SHOP' }} — employee registration, login, and role-based access.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f8f8">
  <link rel="manifest" href="{% url 'core:web_manifest' %}">
  <title>{% block title %}{{ company_name|default:"MY-SHOP" }}{% endblock %}</title>
  <script>
    (function () {
      try {
        var key = "myshop-theme";
        var stored = localStorage.getItem(key);
        var theme = stored === "dark" || stored === "light" ? stored : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="preload" href="{% static 'fonts/manrope-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/core.css' %}?v=20261019-assets">
  <script src="{% static 'vendor/lucide.min.js' %}" defer></script>
  {% block extra_css %}{% endblock %}
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-sync-url="{% url 'employees:sync' %}" data-sync-register-url="{% url 'employees:sync_register' %}">
  {% include "partials/offline_bar.html" %}
  {% block body %}{% endblock %}
  <script defer src="{% static 'js/notify-sound.js' %}?v=1"></script>
  <script defer src="{% static 'js/main.js' %}?v=20261019-assets"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
