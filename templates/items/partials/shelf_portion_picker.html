{% comment %}Trade-out portion targets picker (rows + live total handled by stock-shelf.js).{% endcomment %}
<div class="store-stock-field store-stock-field--full shelf-portion-picker" data-portion-picker>
  <span>Trade out stocks into <em>optional</em></span>
  <input type="hidden" name="portion_links" value="1">
  <div class="item-combo-picker">
    <label class="item-search-field item-combo-search">
      <i data-lucide="search" aria-hidden="true"></i>
      <input
        type="search"
        placeholder="Type to search, or open the list…"
        autocomplete="off"
        data-portion-search
        aria-label="Search items that receive trade-out portions"
        aria-expanded="false"
      >
    </label>
    <div class="item-combo-results" data-portion-results hidden></div>
  </div>
  <datalist data-portion-source>
    {% for opt in shelf_portion_items %}<option value="{{ opt.name }}" data-id="{{ opt.id }}" data-category="{{ opt.category }}">{% endfor %}
  </datalist>
  <div class="item-combo-rows" data-portion-rows></div>
  <p class="item-combo-empty" data-portion-empty>No items picked.</p>
  <p class="item-combo-total">
    Portions per unit <strong data-portion-total>0</strong>
  </p>
</div>
