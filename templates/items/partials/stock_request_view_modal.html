<div
  class="workspace-modal stock-request-view-modal"
  data-stock-request-view-modal
  hidden
  aria-hidden="true"
>
  <div class="workspace-modal-backdrop" data-stock-request-view-close></div>
  <div
    class="workspace-modal-dialog stock-request-view-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="stock-request-view-title"
  >
    <header class="workspace-modal-head">
      <div>
        <p class="stock-request-view-kicker" data-stock-request-view-kicker>Transfer details</p>
        <h2 id="stock-request-view-title" data-stock-request-view-title>Transfer</h2>
      </div>
      <button type="button" class="workspace-modal-close" data-stock-request-view-close aria-label="Close">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </header>
    <div class="stock-request-view-body">
      <div class="stock-request-view-status" data-stock-request-view-status hidden></div>
      <p class="stock-request-view-meta" data-stock-request-view-meta></p>
      <div class="stock-request-view-items-wrap" data-stock-request-view-items-wrap>
        <p class="stock-request-view-items-label" data-stock-request-view-items-label>Items received</p>
        <ul class="stock-request-view-list" data-stock-request-view-list></ul>
      </div>
      <p class="stock-request-view-note" data-stock-request-view-note hidden></p>
    </div>
    <div class="workspace-modal-actions">
      <button type="button" class="btn btn--primary" data-stock-request-view-close>Done</button>
    </div>
  </div>
</div>

<div
  class="workspace-modal stock-request-serials-modal"
  data-stock-request-serials-modal
  hidden
  aria-hidden="true"
>
  <div class="workspace-modal-backdrop" data-stock-request-serials-close></div>
  <div
    class="workspace-modal-dialog stock-report-serials-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="stock-request-serials-title"
  >
    <header class="workspace-modal-head">
      <div>
        <p class="stock-report-serials-kicker">Serial numbers</p>
        <h2 id="stock-request-serials-title" data-stock-request-serials-title>Serials</h2>
      </div>
      <button type="button" class="workspace-modal-close" data-stock-request-serials-close aria-label="Close">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </header>
    <div class="stock-report-serials-body">
      <p class="stock-report-serials-count">
        <span data-stock-request-serials-count>0</span> serial<span data-stock-request-serials-plural>s</span>
      </p>
      <ul class="stock-report-serials-list" data-stock-request-serials-list></ul>
    </div>
    <div class="workspace-modal-actions">
      <button type="button" class="btn btn--primary" data-stock-request-serials-close>Done</button>
    </div>
  </div>
</div>

<script>
  (() => {
    const modal = document.querySelector("[data-stock-request-view-modal]");
    if (!modal || modal.dataset.bound === "1") return;
    modal.dataset.bound = "1";

    const titleEl = modal.querySelector("[data-stock-request-view-title]");
    const kickerEl = modal.querySelector("[data-stock-request-view-kicker]");
    const statusEl = modal.querySelector("[data-stock-request-view-status]");
    const metaEl = modal.querySelector("[data-stock-request-view-meta]");
    const itemsWrap = modal.querySelector("[data-stock-request-view-items-wrap]");
    const itemsLabel = modal.querySelector("[data-stock-request-view-items-label]");
    const listEl = modal.querySelector("[data-stock-request-view-list]");
    const noteEl = modal.querySelector("[data-stock-request-view-note]");
    const serialsModal = document.querySelector("[data-stock-request-serials-modal]");
    const serialsTitle = serialsModal?.querySelector("[data-stock-request-serials-title]");
    const serialsList = serialsModal?.querySelector("[data-stock-request-serials-list]");
    const serialsCount = serialsModal?.querySelector("[data-stock-request-serials-count]");
    const serialsPlural = serialsModal?.querySelector("[data-stock-request-serials-plural]");
    const body = document.body;
    let currentItems = [];

    const escapeHtml = (value) =>
      String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

    const setOpen = (open) => {
      modal.hidden = !open;
      modal.setAttribute("aria-hidden", open ? "false" : "true");
      const anyOpen = document.querySelector(".workspace-modal:not([hidden])");
      body.classList.toggle("workspace-modal-open", Boolean(anyOpen));
      if (open && window.lucide?.createIcons) window.lucide.createIcons();
    };

    const openFromButton = (btn) => {
      const cell = btn.closest(".stock-request-table-view");
      const status = (btn.getAttribute("data-request-status") || "pending").trim().toLowerCase();
      const requestId = (btn.getAttribute("data-request-id") || "").trim();
      const fromShop = (btn.getAttribute("data-from-shop") || "").trim();
      const toShop = (btn.getAttribute("data-to-shop") || "").trim();
      const respondedBy = (btn.getAttribute("data-responded-by") || "").trim();
      const note = (btn.getAttribute("data-note") || "").trim();
      const responseNote = (btn.getAttribute("data-response-note") || "").trim();
      const items = [...(cell?.querySelectorAll(".stock-request-view-data li") || [])].map((li) => ({
        name: (li.getAttribute("data-item-name") || "").trim(),
        qty: (li.getAttribute("data-item-qty") || "").trim(),
        tracked: (li.getAttribute("data-item-tracked") || "") === "1",
        serials: [...(li.querySelectorAll("[data-serial]") || [])]
          .map((el) => (el.textContent || "").trim())
          .filter(Boolean),
      })).filter((item) => item.name);
      currentItems = items;

      if (titleEl) {
        titleEl.textContent = requestId
          ? `Transfer #${requestId}`
          : "Transfer details";
      }
      if (kickerEl) {
        kickerEl.textContent =
          fromShop && toShop ? `${fromShop} → ${toShop}` : "Transfer details";
      }
      if (metaEl) {
        const parts = [];
        if (toShop) parts.push(`Receiving shop: ${toShop}`);
        if (respondedBy) parts.push(`By: ${respondedBy}`);
        metaEl.textContent = parts.join(" · ");
        metaEl.hidden = !parts.length;
      }

      if (statusEl) {
        statusEl.hidden = false;
        statusEl.className = "stock-request-view-status";
        if (status === "fulfilled") {
          statusEl.classList.add("is-accepted");
          statusEl.textContent = "Accepted — items received by this shop";
        } else if (status === "declined") {
          statusEl.classList.add("is-declined");
          statusEl.textContent = responseNote
            ? `Declined / cancelled — ${responseNote}`
            : "This transfer was declined or cancelled";
        } else {
          statusEl.classList.add("is-pending");
          statusEl.textContent = "Pending confirmation from the receiving shop";
        }
      }

      if (itemsWrap && listEl && itemsLabel) {
        if (status === "declined") {
          itemsWrap.hidden = true;
          listEl.innerHTML = "";
        } else {
          itemsWrap.hidden = false;
          itemsLabel.textContent =
            status === "fulfilled" ? "Items received" : "Items requested";
          if (!items.length) {
            listEl.innerHTML =
              '<li class="stock-request-view-empty">No line items on this transfer.</li>';
          } else {
            listEl.innerHTML = items
              .map((item, idx) => {
                const serialEye = item.tracked
                  ? `<button
                        type="button"
                        class="ax-eye stock-request-view-serial-eye"
                        data-request-serials-view="${idx}"
                        aria-label="View ${item.serials.length} serial number${
                          item.serials.length === 1 ? "" : "s"
                        } for ${escapeHtml(item.name)}"
                      ><i data-lucide="eye" aria-hidden="true"></i></button>`
                  : "";
                return `<li><span class="stock-request-view-item-main"><span class="stock-request-view-item-name">${escapeHtml(
                  item.name
                )}</span>${serialEye}</span><span class="stock-request-view-item-qty">×${escapeHtml(
                  item.qty
                )}</span></li>`;
              })
              .join("");
          }
        }
      }

      if (noteEl) {
        const displayNote = responseNote || note;
        if (displayNote) {
          noteEl.hidden = false;
          noteEl.textContent = responseNote
            ? `Reason: ${responseNote}`
            : `Note: ${note}`;
        } else {
          noteEl.hidden = true;
          noteEl.textContent = "";
        }
      }

      setOpen(true);
    };

    const setSerialsOpen = (open) => {
      if (!serialsModal) return;
      serialsModal.hidden = !open;
      serialsModal.setAttribute("aria-hidden", open ? "false" : "true");
      const anyOpen = document.querySelector(".workspace-modal:not([hidden])");
      body.classList.toggle("workspace-modal-open", Boolean(anyOpen));
    };

    const openSerials = (btn) => {
      const idx = Number(btn.getAttribute("data-request-serials-view"));
      const item = currentItems[idx];
      if (!item || !serialsModal || !serialsList) return;
      const serials = item.serials || [];
      if (serialsTitle) {
        serialsTitle.textContent = item.name || "Serial numbers";
      }
      if (serialsCount) serialsCount.textContent = String(serials.length);
      if (serialsPlural) serialsPlural.hidden = serials.length === 1;
      serialsList.innerHTML = serials.length
        ? serials
            .map(
              (serial) =>
                `<li><span class="stock-serial-number">${escapeHtml(serial)}</span></li>`
            )
            .join("")
        : '<li class="stock-request-view-empty">No serial numbers recorded for this item.</li>';
      setSerialsOpen(true);
    };

    document.addEventListener("click", (event) => {
      const serialsBtn = event.target.closest("[data-request-serials-view]");
      if (serialsBtn) {
        event.preventDefault();
        openSerials(serialsBtn);
        return;
      }
      if (event.target.closest("[data-stock-request-serials-close]")) {
        if (serialsModal && !serialsModal.hidden) setSerialsOpen(false);
        return;
      }
      const openBtn = event.target.closest("[data-stock-request-view]");
      if (openBtn) {
        event.preventDefault();
        openFromButton(openBtn);
        return;
      }
      if (event.target.closest("[data-stock-request-view-close]")) {
        if (serialsModal && !serialsModal.hidden) return;
        if (!modal.hidden) setOpen(false);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (serialsModal && !serialsModal.hidden) {
        setSerialsOpen(false);
        return;
      }
      if (!modal.hidden) setOpen(false);
    });
  })();
</script>
