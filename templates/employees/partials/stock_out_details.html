{# Stock-out details — reason / custom reason / refund, applied to every line in the batch. #}
<label class="store-stock-field">
  <span>Reason{% if not stock_req.require_reason_on_out %} <em>optional</em>{% endif %}</span>
  <div class="store-stock-input-wrap">
    <i data-lucide="list-checks" aria-hidden="true"></i>
    <select name="reason" data-stock-reason{% if stock_req.require_reason_on_out %} required{% endif %}>
      <option value="">Select</option>
      {% for value, label in stock_out_reasons %}
      <option value="{{ value }}"{% if value == "custom" %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
</label>
<label class="store-stock-field" data-stock-custom-reason-wrap>
  <span>Custom reason</span>
  <div class="store-stock-input-wrap">
    <i data-lucide="pen-line" aria-hidden="true"></i>
    <input type="text" name="note" maxlength="200" placeholder="Enter reason">
  </div>
</label>
<label class="store-stock-field">
  <span>Refund{% if not stock_req.require_refund_on_out %} <em>optional</em>{% endif %}</span>
  <div class="store-stock-input-wrap">
    <i data-lucide="banknote" aria-hidden="true"></i>
    <select name="refund" data-stock-refund{% if stock_req.require_refund_on_out %} required{% endif %}>
      <option value="">Select</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
  </div>
</label>
<label class="store-stock-field" data-stock-refund-amount-wrap hidden>
  <span>Refund amount</span>
  <div class="store-stock-input-wrap">
    <i data-lucide="coins" aria-hidden="true"></i>
    <input type="number" name="refund_amount" min="0" step="any" inputmode="decimal" placeholder="0.00">
  </div>
</label>
