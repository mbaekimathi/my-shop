<div
  class="workspace-modal"
  id="register-employee-modal"
  data-modal="register-employee"
  {% if not open_register_modal %}hidden{% endif %}
  aria-hidden="{% if open_register_modal %}false{% else %}true{% endif %}"
>
  <div class="workspace-modal-backdrop" data-modal-close></div>
  <div class="workspace-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="register-employee-title">
    <div class="workspace-modal-head">
      <h2 id="register-employee-title">Register employee</h2>
      <button class="workspace-icon-btn" type="button" aria-label="Close" data-modal-close>
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </div>

    {% if open_register_modal and form_errors %}
    <ul class="form-alert-list workspace-modal-errors">
      {% for error in form_errors %}
      <li class="form-alert">{{ error }}</li>
      {% endfor %}
    </ul>
    {% endif %}

    <form
      class="workspace-modal-form"
      method="post"
      enctype="multipart/form-data"
      data-register-form
      novalidate
    >
      {% csrf_token %}
      <input type="hidden" name="action" value="register">
      {% include "employees/partials/employee_form_fields.html" with form_data=form_data countries=countries %}
      <div class="workspace-modal-actions">
        <button class="btn btn--ghost" type="button" data-modal-close>Cancel</button>
        <button class="btn btn--primary" type="submit">
          <i data-lucide="user-plus" aria-hidden="true"></i>
          <span>Register employee</span>
        </button>
      </div>
    </form>
  </div>
</div>
